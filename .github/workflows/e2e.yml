name: E2E

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        working-directory: ./web
        run: corepack enable

      - name: Setup Node/Yarn environment
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: "yarn"
          cache-dependency-path: |
            ./web/yarn.lock
            ./test/e2e/yarn.lock

      - name: Install web
        # Lifecycle scripts are disabled: the build and tests do not need the
        # native build scripts (the deps ship prebuilt binaries), and this avoids
        # executing untrusted package scripts during install.
        run: YARN_ENABLE_SCRIPTS=false yarn install
        working-directory: ./web

      - name: Resolve Go version
        id: go-version
        run: |
          # Install the latest patch release of the go.mod major.minor, so CI
          # never relies on GOTOOLCHAIN auto-downloading an unpatched release
          # when go.mod requires a newer Go (see golang/go#75031).
          echo "version=$(awk '/^go /{print $2}' go.mod | cut -d. -f1-2)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go-version.outputs.version }}
          # Cache the Go module downloads (logstation deps + loggenerator).
          cache: true

      - name: Cache Go build cache
        # Compiled artifacts from `go build`/`go test` (logstation, loggenerator).
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: logstation-go-build-${{ runner.os }}-go${{ steps.go-version.outputs.version }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            logstation-go-build-${{ runner.os }}-go${{ steps.go-version.outputs.version }}-

      - name: Install e2e dependencies
        # Lifecycle scripts are disabled: @playwright/test needs no lifecycle
        # scripts; the browser is installed explicitly by the playwright step
        # below.
        run: YARN_ENABLE_SCRIPTS=false yarn install
        working-directory: ./test/e2e

      # Playwright downloads its browser from its own CDN (not from GitHub),
      # so cache it to keep runs off the ~120 MB download. The key tracks the
      # lockfile, which pins @playwright/test and with it the browser build.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: logstation-playwright-${{ runner.os }}-${{ hashFiles('test/e2e/yarn.lock') }}
          restore-keys: |
            logstation-playwright-${{ runner.os }}-

      - name: Install Playwright browser
        # Invoke the locally installed CLI directly rather than via npx,
        # which could fetch and run an unverified package.
        run: ./node_modules/.bin/playwright install --with-deps chromium
        working-directory: ./test/e2e

      - name: Run E2E suite
        run: bash scripts/test-e2e.sh
