name: E2E

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Enable Corepack
        working-directory: ./web
        run: corepack enable

      - name: Setup Node/Yarn environment
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: "yarn"
          cache-dependency-path: ./web/yarn.lock

      - name: Install web
        # Lifecycle scripts are disabled: the build and tests do not need the
        # native build scripts (the deps ship prebuilt binaries), and this avoids
        # executing untrusted package scripts during install.
        run: YARN_ENABLE_SCRIPTS=false yarn install
        working-directory: ./web

      - name: Resolve Go version
        id: go-version
        run: |
          # Install the latest patch release of the go.mod major.minor, so CI
          # never relies on GOTOOLCHAIN auto-downloading an unpatched release
          # when go.mod requires a newer Go (see golang/go#75031).
          echo "version=$(awk '/^go /{print $2}' go.mod | cut -d. -f1-2)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go-version.outputs.version }}

      - name: Install e2e dependencies
        run: npm ci --no-audit --no-fund
        working-directory: ./test/e2e

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: ./test/e2e

      - name: Run E2E suite
        run: bash scripts/test-e2e.sh
