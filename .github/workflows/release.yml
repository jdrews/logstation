name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'New tag name'
        required: true

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Tag the release
        run: git tag ${{ github.event.inputs.tag }}

      - name: Enable Corepack
        working-directory: ./web
        run: corepack enable

      - name: Setup Node/Yarn environment
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: "yarn"
          cache-dependency-path: ./web/yarn.lock

      - name: Install web
        run: yarn install
        working-directory: ./web

      - name: Build web with Yarn
        run: yarn build
        working-directory: ./web

      - name: Resolve Go version
        id: go-version
        run: |
          # Install the latest patch release of the go.mod major.minor, so CI
          # never relies on GOTOOLCHAIN auto-downloading an unpatched release
          # when go.mod requires a newer Go (see golang/go#75031).
          echo "version=$(awk '/^go /{print $2}' go.mod | cut -d. -f1-2)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ steps.go-version.outputs.version }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v4
        with:
          distribution: goreleaser
          version: latest
          args: release --clean

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}