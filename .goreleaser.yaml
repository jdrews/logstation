version: 2
release:
  target_commitish: '{{ .Commit }}'
  # Prepend a container image section to the release notes. The image is
  # published by the Container Publish workflow (dispatched by release.yml
  # after goreleaser succeeds). Use .Tag (v3.1.1), not .Version (3.1.1):
  # the container images are tagged with the full release tag.
  header: |
    Container images can be pulled and run with docker (or podman).
    Binaries are attached for running without a container.

    ```
    docker pull ghcr.io/jdrews/logstation:{{ .Tag }} # or latest
    docker run --rm -p 8884:8884 ghcr.io/jdrews/logstation:{{ .Tag }}
    ```
before:
  hooks:
    # - yarn -v # For debugging. Historical problems with running 1.x yarn. Need >=3.x yarn (berry)
    # - yarn --cwd web build # Performed via CI in the GitHub Action release.yml, or manually during a manual release (see README.md)
    - go mod tidy
builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin

archives:
  - formats: tar.gz
    # this name template makes the OS and Arch compatible with the results of uname.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
    - goos: windows
      formats: zip
checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ incpatch .Version }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
